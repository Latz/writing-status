version = 1

test_patterns = [
  "tests/**",
]

exclude_patterns = [
  "vendor/**",
  "node_modules/**",
  "stubs/**",
  "docs/**",
]

[[analyzers]]
name = "php"
enabled = true

  [analyzers.meta]
  skip_doc_coverage = ["magic", "nonpublic"]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs", "browser"]
