name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Install integration-runner Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction
        working-directory: tests/integration-runner

      - name: Install SVN
        run: sudo apt-get install -y subversion

      - name: Install WordPress test library
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: ''
          DB_NAME: wordpress_tests
        run: bash bin/install-wp-tests.sh

      - name: Run unit tests
        run: vendor/bin/pest --testsuite=Unit --coverage-clover coverage-unit.xml

      - name: Run integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_ABSPATH: /tmp/wordpress-tests-lib/src/
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: wordpress_tests
        # Runs under the isolated PHPUnit 9.5 toolchain in tests/integration-runner/
        # (see that directory's composer.json) because WordPress core's
        # WP_UnitTestCase (abstract-testcase.php) calls a PHPUnit method removed
        # in PHPUnit 10+, which the main Pest 4 toolchain bundles.
        run: php vendor/bin/phpunit --coverage-clover ../../coverage-integration.xml
        working-directory: tests/integration-runner

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS tests
        run: npm run test:js:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage-unit.xml
            coverage-integration.xml
            bin/reports/coverage-js/lcov.info

  sonarcloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
